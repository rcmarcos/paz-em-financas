<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
      .slide-container {
        width: 1280px;
        min-height: 720px;
        background-color: #FAEED8;
        font-family: 'Poppins', sans-serif;
        color: #2C3531;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 80px 120px 20px; /* keep top padding, reduce bottom */
        position: relative;
        overflow: hidden;
      }
      .decoration-top {
        position: absolute;
        top: 0;
        right: 0;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle at top right, rgba(217, 100, 89, 0.1), transparent);
        border-radius: 0 0 0 100%;
      }
      .divider {
        width: 80px;
        height: 4px;
        background-color: #D96459;
        margin-bottom: 20px; /* reduced */
      }
      h1 {
        font-family: 'Lora', serif;
        font-size: 84px;
        line-height: 1.1;
        color: #1A3322;
        margin-bottom: 24px;
        max-width: 1040px; /* allow single-line when possible */
      }
      .subtitle {
        font-size: 32px;
        font-weight: 400;
        color: #2C3531;
        margin-bottom: 20px; /* reduced */
        max-width: 900px;
        line-height: 1.4;
      }
      .footer {
        display: flex;
        align-items: center;
        gap: 12px; /* tightened */
        font-size: 18px;
        font-weight: 600;
        color: #1A3322;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-top: 8px;
      }
      .icon-circle {
        width: 36px;
        height: 36px;
        background-color: #1A3322;
        color: #FAEED8;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="decoration-top"></div>
        <div class="divider"></div>
        <h1>Paz em Finanças: Como Organizar o Dinheiro sem Perder a Paz</h1>
        <p class="subtitle">Filosofia Estoica e Finanças Comportamentais</p>
        <div class="footer">
            <div class="icon-circle"><i class="fas fa-compass"></i></div>
            <span>Workshop & Palestras • 2026</span>
        </div>
    </div>
</body>
</html>
