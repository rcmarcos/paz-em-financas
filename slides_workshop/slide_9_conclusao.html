<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@700;900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      .slide-container {
        width: 1280px;
        min-height: 720px;
        background-color: #FAEED8;
        font-family: 'Poppins', sans-serif;
        color: #2C3531;
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }
      .content-wrapper {
        padding-top: 40px;
        padding-left: 120px;
        padding-right: 120px;
        text-align: center;
      }
      .icon-large {
        font-size: 64px;
        color: #1A3322;
        margin-bottom: 30px;
      }
      h2 {
        font-family: 'Lora', serif;
        font-size: 72px;
        color: #1A3322;
        margin-bottom: 24px;
        font-weight: 900;
      }
      .final-message {
        font-size: 28px;
        line-height: 1.5;
        max-width: 900px;
        margin: 0 auto 60px;
        color: #2C3531;
      }
      .action-grid {
        display: grid;
        grid-template-columns: 1fr 2px 1fr;
        gap: 40px;
        max-width: 800px;
        margin: 0 auto;
        align-items: center;
      }
      .vertical-divider {
        background-color: #D96459;
        height: 100px;
      }
      .action-item {
        text-align: center;
      }
      .action-item strong {
        display: block;
        font-size: 20px;
        color: #1A3322;
        margin-bottom: 8px;
      }
      .action-item p {
        font-size: 16px;
        color: #D96459;
        font-weight: 600;
      }
      .footer-brand {
        position: absolute;
        bottom: 60px;
        left: 0;
        right: 0;
        font-family: 'Lora', serif;
        font-size: 24px;
        font-weight: 700;
        color: #1A3322;
        opacity: 0.6;
      }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="content-wrapper">
            <div class="icon-large"><i class="fas fa-compass"></i></div>
            <h2>Clareza é o Caminho</h2>
            <p class="final-message">
                A paz financeira não nasce da perfeição matemática, mas da coerência entre o que você valoriza e como você gasta. Comece pequeno, ajuste a vela e aceite o vento.
            </p>
            
            <div class="action-grid">
                <div class="action-item">
                    <strong>Acesse o Portal</strong>
                    <p>paz-em-financas.com.br</p>
                </div>
                <div class="vertical-divider"></div>
                <div class="action-item">
                    <strong>Baixe as Planilhas</strong>
                    <p>Guias Práticos & Templates</p>
                </div>
            </div>
        </div>
        <div class="footer-brand">Paz em Finanças</div>
    </div>
</body>
</html>
