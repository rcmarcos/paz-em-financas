name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-desktop:
    name: Build ${{ matrix.platform }} installers
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-14
            target: mac
            target_args: "dmg zip"
          - platform: Windows
            runner: windows-2022
            target: win
            target_args: "nsis portable"
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        shell: bash
        run: npm install --global pnpm@10.4.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        run: pnpm desktop:build

      - name: Build native installers
        shell: bash
        run: pnpm exec electron-builder --${{ matrix.target }} ${{ matrix.target_args }} --config desktop/electron-builder.yml --publish never

      - name: Smoke test Windows Portable
        if: matrix.target == 'win'
        shell: pwsh
        env:
          PAZ_SMOKE_TEST: "true"
        run: |
          $portable = Get-ChildItem -Path release -Filter "*Portable*.exe" | Select-Object -First 1
          if (-not $portable) { throw "Portable executable not found" }
          $userData = Join-Path $env:RUNNER_TEMP "paz-smoke-user-data"
          Remove-Item -Recurse -Force $userData -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $userData | Out-Null
          & $portable.FullName --user-data-dir=$userData --no-sandbox --disable-gpu
          $exitCode = $LASTEXITCODE
          $resultPath = Join-Path $userData "paz-smoke-result.json"
          if (-not (Test-Path $resultPath)) { throw "Smoke test did not write $resultPath (exit code $exitCode)" }
          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          $result | ConvertTo-Json -Compress
          if ($exitCode -ne 0 -or -not $result.ok) { throw "Portable smoke test failed: $($result.reason) (exit code $exitCode)" }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: paz-em-financas-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
