name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-desktop:
    name: Build ${{ matrix.platform }} installers
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-14
            target: mac
            target_args: "dmg zip"
          - platform: Windows
            runner: windows-2022
            target: win
            target_args: "nsis portable"
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        shell: bash
        run: corepack enable && corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        run: pnpm desktop:build

      - name: Build native installers
        shell: bash
        run: pnpm exec electron-builder --${{ matrix.target }} ${{ matrix.target_args }} --config desktop/electron-builder.yml --publish never

      - name: Smoke test Windows Portable
        if: matrix.target == 'win'
        shell: pwsh
        env:
          PAZ_SMOKE_TEST: "true"
        run: |
          $portable = Get-ChildItem -Path release -Filter "*Portable*.exe" | Select-Object -First 1
          if (-not $portable) { throw "Portable executable not found" }
          & $portable.FullName --no-sandbox --disable-gpu
          if ($LASTEXITCODE -ne 0) { throw "Portable smoke test failed with exit code $LASTEXITCODE" }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: paz-em-financas-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
