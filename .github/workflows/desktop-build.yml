name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-desktop:
    name: Build ${{ matrix.platform }} installers
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-14
            target: mac
            target_args: "dmg zip"
          - platform: Windows
            runner: windows-2022
            target: win
            target_args: "nsis portable"
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        shell: bash
        run: npm install --global pnpm@10.4.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        run: pnpm desktop:build

      - name: Build native installers
        shell: bash
        run: pnpm exec electron-builder --${{ matrix.target }} ${{ matrix.target_args }} --config desktop/electron-builder.yml --publish never

      - name: Smoke test Windows installers
        if: matrix.target == 'win'
        shell: pwsh
        run: pwsh -File desktop/smoke-windows.ps1

      - name: Smoke test macOS installers
        if: matrix.target == 'mac'
        shell: bash
        run: bash desktop/smoke-macos.sh release

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: paz-em-financas-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
